# Tooling config only — packaging stays requirements.txt-based.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Right-sized for a solo project: correctness + unused-code rules; no
# style bikeshedding (the codebase has its own consistent conventions).
select = ["E4", "E7", "E9", "F", "B", "UP032"]
ignore = [
    "B008",  # FastAPI's Depends(...) in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
# Tests may use quick lambdas for spies.
"tests/*" = ["E731"]

[tool.coverage.run]
# SQLAlchemy's asyncio layer runs ORM work inside greenlet_spawn. Without
# these tracers coverage.py stops recording at the first bridged await, so
# every line after it in the frame reads as never executed — route modules
# that the suite exercises end to end were reporting as low as 24%.
concurrency = ["thread", "greenlet"]
