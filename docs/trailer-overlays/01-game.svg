<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title">
  <title id="title">Know the game. Live context, odds, lineups, and where to watch.</title>
  <defs>
    <linearGradient id="card" x1="0" x2="1">
      <stop stop-color="#101318" stop-opacity=".97"/>
      <stop offset="1" stop-color="#1a2029" stop-opacity=".93"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#e8643c"/><stop offset="1" stop-color="#d4d94f"/>
    </linearGradient>
  </defs>
  <rect x="54" y="514" width="756" height="150" rx="24" fill="url(#card)" stroke="#fff" stroke-opacity=".12"/>
  <rect x="54" y="514" width="8" height="150" rx="4" fill="url(#line)"/>
  <text x="92" y="566" fill="#e8643c" font-family="SF Pro Text, Inter, Arial, sans-serif"
        font-size="17" font-weight="800" letter-spacing="3">KNOW THE GAME</text>
  <text x="92" y="615" fill="#f8f5ef" font-family="SF Pro Display, Inter, Arial, sans-serif"
        font-size="31" font-weight="700">Live context. Odds. Lineups. Where to watch.</text>
</svg>
