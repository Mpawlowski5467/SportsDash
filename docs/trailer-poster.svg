<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SportsDash trailer</title>
  <desc id="desc">SportsDash logo with the words Your sports, one screen and a play button.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#252a32"/>
      <stop offset="0.58" stop-color="#111318"/>
      <stop offset="1" stop-color="#08090c"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#e8643c"/>
      <stop offset="0.52" stop-color="#c9d14a"/>
      <stop offset="1" stop-color="#3b6fd4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="logo-w0"><path d="M60,60 L60,8 A52,52 0 0 1 105,34 Z"/></clipPath>
    <clipPath id="logo-w1"><path d="M60,60 L105,34 A52,52 0 0 1 105,86 Z"/></clipPath>
    <clipPath id="logo-w2"><path d="M60,60 L105,86 A52,52 0 0 1 60,112 Z"/></clipPath>
    <clipPath id="logo-w3"><path d="M60,60 L60,112 A52,52 0 0 1 15,86 Z"/></clipPath>
    <clipPath id="logo-w4"><path d="M60,60 L15,86 A52,52 0 0 1 15,34 Z"/></clipPath>
    <clipPath id="logo-w5"><path d="M60,60 L15,34 A52,52 0 0 1 60,8 Z"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#glow)"/>
  <ellipse cx="800" cy="472" rx="440" ry="290" fill="#000" opacity=".32" filter="url(#shadow)"/>
  <g transform="translate(680 150) scale(2)">
    <path d="M60 60 L60 8 A52 52 0 0 1 105 34 Z" fill="#e8643c"/>
    <path d="M60 60 L105 34 A52 52 0 0 1 105 86 Z" fill="#f4f1ec"/>
    <path d="M60 60 L105 86 A52 52 0 0 1 60 112 Z" fill="#c9d14a"/>
    <path d="M60 60 L60 112 A52 52 0 0 1 15 86 Z" fill="#3b6fd4"/>
    <path d="M60 60 L15 86 A52 52 0 0 1 15 34 Z" fill="#f4efe6"/>
    <path d="M60 60 L15 34 A52 52 0 0 1 60 8 Z" fill="#9a6a43"/>
    <g clip-path="url(#logo-w0)"><path d="M60,8 V112 M8,60 H112 M60,8 Q18,60 60,112 M60,8 Q102,60 60,112" fill="none" stroke="#15171c" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g clip-path="url(#logo-w1)"><path d="M82,49 L92.5,56.6 L88.5,68.9 L75.5,68.9 L71.5,56.6 Z" fill="#15171c"/></g>
    <g clip-path="url(#logo-w2)"><path d="M104,70 C84,72 80,86 64,104 M98,57 C86,66 88,82 78,99" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g clip-path="url(#logo-w3)"><path d="M16,84 Q40,74 60,60 M28,98 Q48,84 66,82 M10,68 Q34,72 52,64" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g clip-path="url(#logo-w4)"><path d="M24,32 Q36,60 24,88" fill="none" stroke="#d8423b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g clip-path="url(#logo-w5)">
      <path d="M37,16 L47,42" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M32,23 L42,20 M34,30 L44,27 M36,37 L46,34" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round">
      <path d="M60 60 L60 8"/>
      <path d="M60 60 L105 34"/>
      <path d="M60 60 L105 86"/>
      <path d="M60 60 L60 112"/>
      <path d="M60 60 L15 86"/>
      <path d="M60 60 L15 34"/>
      <circle cx="60" cy="60" r="52"/>
    </g>
    <circle cx="60" cy="60" r="4.5" fill="#fff"/>
  </g>

  <text x="800" y="495" text-anchor="middle" fill="#f7f4ee"
        font-family="SF Pro Display, Inter, Arial, sans-serif"
        font-size="104" font-weight="700" letter-spacing="-4">SportsDash</text>
  <rect x="554" y="532" width="492" height="8" rx="4" fill="url(#accent)"/>
  <text x="800" y="630" text-anchor="middle" fill="#c8cbd1"
        font-family="SF Pro Text, Inter, Arial, sans-serif"
        font-size="42" font-weight="500" letter-spacing="1">Your sports. One screen.</text>

  <circle cx="800" cy="738" r="58" fill="#f7f4ee"/>
  <path d="M783 705 L833 738 L783 771 Z" fill="#111318"/>
  <text x="800" y="842" text-anchor="middle" fill="#8d929c"
        font-family="SF Pro Text, Inter, Arial, sans-serif"
        font-size="22" font-weight="600" letter-spacing="3">WATCH THE LIVE PRODUCT TRAILER</text>
</svg>
