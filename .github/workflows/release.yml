name: Release desktop app

# Builds the macOS .dmg (PyInstaller-frozen onedir backend bundle, shipped
# in the app's Resources + Tauri shell) and attaches it to the GitHub
# Release for the tag.
#
# NOTE: without an Apple Developer ID the app is unsigned — users must
# right-click → Open past Gatekeeper (see docs/desktop.md, and the
# code-signing item on ROADMAP.md).

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write # create the release + upload the asset

jobs:
  macos-dmg:
    runs-on: macos-latest
    # Signing/notarization turn on automatically once the repo secrets
    # exist (see docs/desktop.md "Code signing"); until then the build
    # stays unsigned and everything else works as before. The secrets are
    # wired into the build step's own env below, never job-wide.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # build-desktop.sh installs requirements.lock into a fresh venv
          # that shares this cache, so the lock must be in the key.
          cache-dependency-path: backend/requirements*
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - name: Build SportsDash.app + .dmg
        # Tauri v2 reads these env vars natively: it imports the base64
        # .p12 into a temporary keychain, signs with the given identity
        # (hardened runtime), and notarizes + staples via notarytool.
        # Scoped to this step on purpose — writing them to $GITHUB_ENV
        # instead would hand every later step the certificate and the
        # notarization password, including third-party actions and the
        # post-steps that setup-bun/rust-cache register at job cleanup.
        # GitHub cannot omit an env key conditionally, so these arrive as
        # empty strings when the secrets are unset; build-desktop.sh drops
        # the empty ones so the build stays unsigned, exactly as before.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/build-desktop.sh
      - name: Locate artifacts
        id: artifacts
        run: |
          dmg=$(ls frontend/src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifacts.outputs.dmg }}
          generate_release_notes: true
      - name: Upload workflow artifact (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: SportsDash-dmg
          path: ${{ steps.artifacts.outputs.dmg }}
