name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs of the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Glob without the extension so requirements.lock — the file
          # actually installed below — is part of the cache key.
          cache: pip
          cache-dependency-path: backend/requirements*
      - run: pip install -r requirements.lock -r requirements-dev.txt
      # desktop_server.py is the PyInstaller entrypoint for the shipped
      # macOS app; it lives outside app/ but is production code.
      - run: ruff check app tests desktop_server.py
      - run: ruff format --check app tests desktop_server.py
      # The suite is hermetic (no network) and runs in ~5s. Coverage needs
      # the greenlet tracer from pyproject.toml to see through SQLAlchemy's
      # async bridge.
      - run: pytest -q --cov=app --cov-report=term-missing

  # Same suite against real Postgres/asyncpg — the driver returns tz-AWARE
  # datetimes (SQLite returns naive) and enforces FKs/VARCHAR widths, which
  # is exactly the class of bug the sqlite-only run can't see.
  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sportsdash
          POSTGRES_PASSWORD: sportsdash
          POSTGRES_DB: sportsdash_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sportsdash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPORTSDASH_TEST_DATABASE_URL: postgresql+asyncpg://sportsdash:sportsdash@localhost:5432/sportsdash_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # exhaustive-deps stays advisory (the codebase hand-tunes several dep
      # arrays on purpose), but a stale eslint-disable must fail: catching
      # those is the reason eslint.config.js exists, and at plain "warn" the
      # step exits 0 and reports nothing.
      - run: bun run lint --report-unused-disable-directives-severity=error
      - run: bun run test
      - run: bun run build
