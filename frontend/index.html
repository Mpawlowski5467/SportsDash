<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#09090b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="SportsDash" />
    <title>SportsDash</title>
    <!--
      No-FOUC theme bootstrap. Runs before the stylesheet paints and before
      main.tsx loads, so the persisted theme's palette is in place on the
      very first frame (no flash of the dark default). Mirrors the values in
      src/lib/theme.ts (localStorage key, allowed ids, default). Kept inline
      and dependency-free on purpose.

      `THEMES` below maps id -> is-dark, so adding a theme is ONE edit here
      rather than two: the id list and the dark-based test used to be
      separate expressions, and a new dark theme that was added to the first
      but not the second booted with the wrong `dark` class for a frame.
    -->
    <script>
      (function () {
        try {
          var THEMES = { dark: 1, light: 0, custom: 1, contrast: 1 };
          // Retired/renamed ids still sitting in a returning user's storage.
          // Mirrors LEGACY_THEME_IDS in src/lib/theme.ts; without it the
          // first paint would use the default while React later applied the
          // migrated theme, which is the flash this script exists to avoid.
          var LEGACY = {
            stadium: "custom",
            floodlight: "dark",
            ember: "dark",
            newsprint: "light",
          };
          var stored = window.localStorage.getItem("sportsdash.theme");
          // hasOwnProperty, not `in` / truthiness: a stored value of
          // "constructor" or "toString" hits Object.prototype and would
          // otherwise be accepted as a theme id.
          var own = Object.prototype.hasOwnProperty;
          var theme = "dark";
          if (stored !== null) {
            if (own.call(THEMES, stored)) theme = stored;
            else if (own.call(LEGACY, stored)) theme = LEGACY[stored];
          }
          var root = document.documentElement;
          root.setAttribute("data-theme", theme);
          root.classList.toggle("dark", THEMES[theme] === 1);
        } catch (e) {
          /* storage blocked — leave the dark default from <html class="dark"> */
        }
      })();
    </script>
  </head>
  <body style="background-color: var(--color-zinc-950, #09090b)">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
