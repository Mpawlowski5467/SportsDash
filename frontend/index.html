<!doctype html>
<html lang="en" data-theme="light" data-palette="brand">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="SportsDash" />
    <title>SportsDash</title>
    <!--
      No-FOUC theme bootstrap. Runs before the stylesheet paints and before
      main.tsx loads, so the persisted appearance is in place on the very
      first frame (no flash of the light default, and no flash of the brand
      orange under the Team palette). Mirrors src/lib/theme.ts: the storage
      keys, the id table (STORED_THEME_IDS) and the defaults. A test
      (theme.test.ts) reads this script and fails if the two drift. Kept
      inline and dependency-free on purpose.

      `STORED` maps every id a build has ever written to [base, palette it
      implied]. Until Box Score the theme was one choice, so "custom" (and
      "stadium" before it) meant the dark base tinted by a followed team:
      now Dark + Team. An explicit stored palette always wins over the one
      an old id implies.

      `BASES` maps base -> [is dark, takes the Team palette, theme-color],
      so adding a base is ONE edit here rather than three.
    -->
    <script>
      (function () {
        try {
          var STORED = {
            light: ["light"],
            dark: ["dark"],
            contrast: ["contrast"],
            custom: ["dark", "team"],
            stadium: ["dark", "team"],
            floodlight: ["dark"],
            ember: ["dark"],
            newsprint: ["light"],
          };
          var BASES = {
            light: [0, 1, "#ffffff"],
            dark: [1, 1, "#171c22"],
            contrast: [1, 0, "#000000"],
          };
          var storage = window.localStorage;
          // hasOwnProperty, not `in` / truthiness: a stored value of
          // "constructor" or "toString" hits Object.prototype and would
          // otherwise be accepted as a theme id.
          var own = Object.prototype.hasOwnProperty;
          var stored = storage.getItem("sportsdash.theme");
          var known =
            stored !== null && own.call(STORED, stored)
              ? STORED[stored]
              : ["light"];
          var theme = known[0];
          var base = BASES[theme];
          var storedPalette = storage.getItem("sportsdash.palette");
          var palette =
            storedPalette === "brand" || storedPalette === "team"
              ? storedPalette
              : known[1] || "brand";
          if (base[1] !== 1) palette = "brand";

          var root = document.documentElement;
          root.setAttribute("data-theme", theme);
          root.setAttribute("data-palette", palette);
          var scheme = document.querySelector('meta[name="color-scheme"]');
          if (scheme) scheme.setAttribute("content", base[0] ? "dark" : "light");
          var chrome = document.querySelector('meta[name="theme-color"]');
          if (chrome) chrome.setAttribute("content", base[2]);

          // Kiosk scales the sheet from the root font size; set it before
          // paint so a wall display does not start small and jump.
          if (storage.getItem("sportsdash.kiosk") === "1") {
            root.setAttribute("data-kiosk", "");
          }

          // Last, because it parses stored JSON: a corrupt cache throws to
          // the catch below and must not take anything above with it.
          // The Team palette's measured colours, cached by the app for this
          // base (see setTeamAccent). Only known variable names and plain
          // colour values are applied: this is storage, so it is untrusted.
          if (palette === "team") {
            var cached = JSON.parse(
              storage.getItem("sportsdash.teamAccent") || "null",
            );
            if (cached && cached.theme === theme && cached.vars) {
              var names = [
                "--sd-accent",
                "--sd-on-accent",
                "--sd-accent-text",
                "--sd-accent-edge",
                "--sd-accent-edge-block",
              ];
              for (var i = 0; i < names.length; i++) {
                var value = cached.vars[names[i]];
                if (
                  typeof value === "string" &&
                  /^(#[0-9a-f]{6}|transparent)$/.test(value)
                ) {
                  root.style.setProperty(names[i], value);
                }
              }
            }
          }
        } catch (e) {
          /* storage blocked or corrupt: the light default in the markup
             and stylesheet stands */
        }
      })();
    </script>
  </head>
  <body style="background-color: var(--bs-ground, #f1f2f4)">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
